name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prepared stable version from package.json (for example 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11
      - run: node scripts/check-release.mjs "$RELEASE_VERSION"
      - name: Reject an existing release tag
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo 'Release tag already exists'
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run test:consumer
      - name: Publish using npm Trusted Publishing (OIDC)
        run: npm publish --access public --provenance
      - name: Create GitHub release and tag for the published commit
        run: gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --title "v${RELEASE_VERSION}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
